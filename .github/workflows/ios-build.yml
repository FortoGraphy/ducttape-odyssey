name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      render:
        description: "both = full (Skia) + lite (fallback) IPA, or build just one"
        type: choice
        options: [both, skia, lite]
        default: both
  push:
    tags: ["v*"]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test --if-present
      - name: Content validation
        run: npm run validate --if-present

  build:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        render: ${{ fromJSON((github.event.inputs.render == 'skia' && '["skia"]') || (github.event.inputs.render == 'lite' && '["lite"]') || '["skia","lite"]') }}
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_RENDER: ${{ matrix.render }}
      SUFFIX: ${{ matrix.render == 'lite' && 'release-lite' || 'release' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode version (Expo SDK 57 needs 26.4+)
        run: |
          V=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode $V"
          printf '%s\n26.4\n' "$V" | sort -V -C -r || { echo "::error::Xcode $V is older than 26.4"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Ensure Skia prebuilt libraries (postinstall may be skipped by npm script policy)
        run: |
          if [ ! -d node_modules/@shopify/react-native-skia/libs/ios/libskia.xcframework ]; then
            (cd node_modules/@shopify/react-native-skia && node scripts/install-libs.js)
          fi
          ls node_modules/@shopify/react-native-skia/libs/ios

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Check entitlements (free Apple ID signing)
        run: node scripts/ci/check-entitlements.mjs ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: CocoaPods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|^\*\* BUILD" build.log | sort -u | head -n 80 || true
          if [ $STATUS -ne 0 ]; then
            echo "::group::Last 200 lines of build.log"
            tail -n 200 build.log
            echo "::endgroup::"
            exit $STATUS
          fi
          APP="build/Build/Products/Release-iphoneos/${SCHEME}.app"
          test -f "$APP/Info.plist"
          test -f "$APP/main.jsbundle"

      - name: Verify built app (bundle id, no forbidden entitlements)
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/${SCHEME}.app"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle ID: $BID"
          [ "$BID" = "cz.johny.ducttape" ] || { echo "::error::Bundle ID changed to $BID (save data would be lost)"; exit 1; }
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" 2>/dev/null | grep -q '[a-z]'; then
            echo "::error::UIBackgroundModes present in built Info.plist"; exit 1
          fi
          du -sh "$APP"
          ls -lh "$APP/main.jsbundle"
          node scripts/ci/check-lite-bundle.mjs "$APP" "${{ matrix.render }}"

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/${SCHEME}.app" Payload/
          IPA="DuctTapeOdyssey-${SUFFIX}-$(date +%Y%m%d-%H%M).ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: DuctTapeOdyssey-${{ env.SUFFIX }}
          path: ${{ env.IPA }}
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ matrix.render }}
          path: build.log
